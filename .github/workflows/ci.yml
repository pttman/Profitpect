name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Verify Android payment parser
        run: |
          mkdir -p android/build/parser-tests
          javac -encoding UTF-8 --release 8 -d android/build/parser-tests android/app/src/main/java/com/xiaozhang/island/PaymentParser.java android/tests/PaymentParserTest.java
          java -cp android/build/parser-tests com.xiaozhang.island.PaymentParserTest
          javac -encoding UTF-8 --release 8 -d android/build/parser-tests android/app/src/main/java/com/xiaozhang/island/PaymentParser.java android/app/src/main/java/com/xiaozhang/island/PaymentPageParser.java android/tests/PaymentPageParserTest.java
          java -cp android/build/parser-tests com.xiaozhang.island.PaymentPageParserTest
